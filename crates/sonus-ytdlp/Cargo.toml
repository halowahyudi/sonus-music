[package]
name = "sonus-ytdlp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "yt-dlp subprocess integration for Sonus"

[dependencies]
sonus-core.workspace = true
sonus-deps.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Innertube access is plain JSON over HTTPS; rustls keeps it dependency-light
# and avoids needing a system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
